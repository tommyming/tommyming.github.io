# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Runs hourly to release scheduled posts. Posts with a future front matter
  # `date` (and `draft = false`) are kept hidden by Hugo until that time
  # passes; the check job below triggers a rebuild only when a post has
  # become due since the last deployment.
  schedule:
    - cron: "17 * * * *" # hourly, at an off-peak minute (UTC)

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Release check job (scheduled runs only): skip the build entirely when no
  # post has reached its release time since the last deployment.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check for posts due for release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes and manual runs always build; only scheduled runs are gated.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_DEPLOY=$(gh api \
            "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=1" \
            --jq '.[0].created_at // empty')
          export LAST_DEPLOY

          DUE_POSTS=$(python3 .github/scripts/check_pending_posts.py)
          if [ -n "$DUE_POSTS" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Posts due for release:"
            echo "$DUE_POSTS"
          else
            echo "No posts due for release; skipping build."
          fi

  # Build job
  build:
    needs: check
    if: needs.check.outputs.due == 'true'
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.2
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Install Node.js dependencies
        run: "[[ -f package-lock.json || -f npm-shrinkwrap.json ]] && npm ci || true"
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: America/Los_Angeles
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
