baseURL: https://mingtommy.dev/
theme: blowfish
defaultContentLanguage: en
title: Tommy Han

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    params:
      displayName: EN
      isoCode: en-US
      dateFormat: 2 Jan 2006
      description: Personal Blog
      author:
        name: Tommy Han
        image: avatar.png
        bio: A personal blog, mostly about code, sometimes photography.
        links:
          - github: https://github.com/tommyming

markup:
  highlight:
    noClasses: false

params:
  colorScheme: mingtommy
  defaultAppearance: light
  autoSwitchAppearance: true
  enableSearch: false
  enableCodeCopy: false
  mainSections:
    - posts

  header:
    layout: basic

  footer:
    showMenu: false
    showCopyright: true
    showThemeAttribution: true
    showAppearanceSwitcher: true
    showScrollToTop: true

  homepage:
    layout: profile
    showRecent: true
    showRecentItems: 5
    showMoreLink: true
    showMoreLinkDest: /posts/

  article:
    showDate: true
    showDateUpdated: false
    showAuthor: false
    showReadingTime: false
    showWordCount: false
    showBreadcrumbs: false
    showDraftLabel: true
    showHeadingAnchors: true
    showPagination: true
    showTaxonomies: false
    showComments: false

  list:
    showBreadcrumbs: false
    showTableOfContents: false
    showSummary: false
    showCards: false
    groupByYear: true
    constrainItemsWidth: false

  taxonomy:
    showTermCount: true

  term:
    groupByYear: true

menu:
  main:
    - identifier: coding
      name: Coding
      pageRef: /categories/coding
      url: /categories/coding/
      weight: 10
    - identifier: cats
      name: Cats
      pageRef: /categories/cats
      url: /categories/cats/
      weight: 20
    - identifier: streets
      name: Streets
      pageRef: /categories/streets
      url: /categories/streets/
      weight: 30
