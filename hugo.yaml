baseURL: https://mingtommy.dev/
theme: blowfish
defaultContentLanguage: en
title: Tommy Han

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    params:
      displayName: EN
      isoCode: en-US
      dateFormat: 2 Jan 2006
      description: Blog about code and software. Sometimes photography and cats.
      author:
        name: Tommy Han
        image: avatar.png
        bio: Blog about code and software. Sometimes photography and cats.
        links:
          - email: contact@mingtommy.dev
          - github: https://github.com/tommyming

markup:
  highlight:
    noClasses: false

taxonomies:
  tag: tags
  category: categories
  author: authors
  series: series

params:
  colorScheme: mingtommy
  enableStructuredBreadcrumbs: true
  seo:
    metaDescriptionOrder:
      - description
      - summary
      - site
  defaultAppearance: light
  autoSwitchAppearance: true
  enableSearch: false
  enableCodeCopy: false
  mainSections:
    - posts

  header:
    layout: basic

  footer:
    showMenu: false
    showCopyright: true
    showThemeAttribution: true
    showAppearanceSwitcher: true
    showScrollToTop: true

  homepage:
    layout: profile
    showRecent: true
    showRecentItems: 5
    showMoreLink: true
    showMoreLinkDest: /posts/

  article:
    showDate: true
    showDateUpdated: false
    showAuthor: false
    showReadingTime: true
    showWordCount: false
    showBreadcrumbs: false
    showDraftLabel: true
    showHeadingAnchors: true
    showReadingProgress: true
    showTableOfContents: true
    showPagination: true
    showTaxonomies: false
    showComments: false
    seriesOpened: true

  list:
    showBreadcrumbs: false
    showTableOfContents: false
    showSummary: false
    showCards: false
    groupByYear: true
    constrainItemsWidth: false

  taxonomy:
    showTermCount: true

  term:
    groupByYear: true

menu:
  main:
    - identifier: blog
      name: Blog
      pageRef: /categories/blog
      url: /categories/blog/
      weight: 10
    - identifier: photos
      name: Photos
      pageRef: /categories/photos
      url: /categories/photos/
      weight: 20
    - identifier: tech-studies
      name: Tech Studies
      pageRef: /categories/tech-studies
      url: /categories/tech-studies/
      weight: 30
