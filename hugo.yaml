    description: A Programming Cat. A personal blog, mostly about code, sometimes photography.
  webmanifest:
    name: Programming Cat
    short_name: Programming Cat
    theme_color: "#ffffff"
    background_color: "#ffffff"
    display: standalone
  socialIcons:
    - name: github
      url: https://github.com/tommyming

menu:
