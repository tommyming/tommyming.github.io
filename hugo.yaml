defaultContentLanguage: en-us
title: Tommy Han

languages:
  en-us:
    label: English
    locale: en-US
    weight: 1

markup:
  highlight:
    noClasses: false

params:
  sitename: Tommy Han
  defaultColor: auto
  description: Personal Blog
  mainSections:
    - posts
  rssFeedDescription: summary
  author:
    avatar: avatar.png
