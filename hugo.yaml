    - identifier: coding
      name: Coding
      pageRef: /categories/coding
      url: /categories/coding/
      weight: 10
    - identifier: cats
      name: Cats
      pageRef: /categories/cats
      url: /categories/cats/
      weight: 20
    - identifier: streets
      name: Streets
